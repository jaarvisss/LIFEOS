version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 Database with Native pgvector Extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifeos-postgres
    restart: always
    environment:
      POSTGRES_DB: lifeos_db
      POSTGRES_USER: lifeos_app
      POSTGRES_PASSWORD: lifeos_secret_password
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos_app -d lifeos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 In-Memory Cache & Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lifeos-redis
    restart: always
    command: redis-server --requirepass lifeos_redis_secret --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "lifeos_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin 4 Database Administration Web Interface
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lifeos-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lifeos.com
      PGADMIN_DEFAULT_PASSWORD: admin_secret_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
